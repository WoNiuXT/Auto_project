services:
  postgres:
    image: postgres:16
    container_name: pipeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline123
      POSTGRES_DB: pipeline
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5

  dailyhot-api:
    image: imsyy/dailyhot-api:latest
    container_name: dailyhot-api
    restart: unless-stopped
    ports:
      - "6688:6688"

volumes:
  pgdata: